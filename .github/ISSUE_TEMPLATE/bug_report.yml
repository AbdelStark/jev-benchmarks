name: Bug report
description: Report incorrect benchmark, metric, artifact, or CLI behavior.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, sensitive inputs, or private prediction logs.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the exact error and why the result is incorrect.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide commands, config, and the smallest safe fixture that reproduces the issue.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Repository revision
      placeholder: git rev-parse HEAD
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, operating system, device, and relevant package versions.
    validations:
      required: true
